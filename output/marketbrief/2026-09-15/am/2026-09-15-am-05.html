<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1440px;background:#EEECE6;color:#25282A;font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}
body:before{content:'';position:absolute;left:24px;top:36px;bottom:36px;width:22px;background:radial-gradient(circle,#CDD1D2 0 7px,transparent 8px) center top/22px 54px repeat-y}
main{position:relative;margin:34px 38px 34px 62px;width:980px;height:1372px;padding:68px 68px 52px;background:#FBF9F3;border:1px solid #CDD1D2;box-shadow:0 14px 36px rgba(58,47,39,.10);overflow:hidden}
main:after{content:none}
.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.tape{display:inline-block;padding:10px 18px;background:#E8D98C;transform:rotate(-1.2deg);font-size:24px;font-weight:800;letter-spacing:1px}
.edition{font-size:23px;font-weight:700;color:#667078;padding-top:8px}
.kicker{position:relative;z-index:1;font-size:25px;font-weight:800;letter-spacing:3px;color:#667078;margin-bottom:18px}
h1{position:relative;z-index:1;font-size:72px;line-height:1.12;margin:0 0 20px;font-weight:900;letter-spacing:-2px}
h1 span{background:linear-gradient(transparent 62%,#B8CDE0 62% 88%,transparent 88%);padding:0 .08em}
.sub{position:relative;z-index:1;font-size:31px;line-height:1.5;color:#667078;margin-bottom:34px;max-width:850px}
.ribbon{position:relative;z-index:1;display:inline-block;padding:8px 16px;margin-bottom:30px;background:#D7CDE6;font-size:22px;font-weight:700;transform:rotate(.6deg)}
.notes{position:relative;z-index:1;display:grid;gap:21px}
.note{position:relative;min-height:145px;padding:26px 30px 24px 92px;background:rgba(255,255,255,.56);border:1px solid #CDD1D2;box-shadow:4px 5px 0 rgba(0,0,0,.035);transform:rotate(-.2deg)}
.note:nth-child(2){transform:rotate(.35deg)}.note:nth-child(3){transform:rotate(-.15deg)}
.note b{position:absolute;left:28px;top:24px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#E8D98C;font-size:24px}
.note p{margin:0;font-size:31px;line-height:1.55;font-weight:650}
.margin{position:relative;z-index:1;margin-top:28px;display:flex;gap:18px;align-items:center;color:#667078;font-size:22px}
.sketch{width:64px;height:30px;border-bottom:4px solid #B8CDE0;border-radius:50%;transform:rotate(-7deg)}
footer{position:absolute;z-index:1;left:68px;right:68px;bottom:48px;border-top:1px dashed #CDD1D2;padding-top:20px;display:flex;justify-content:space-between;gap:20px;color:#667078;font-size:20px}
</style></head>
<body><main>
<div class="top"><span class="tape">MarketBrief</span><span class="edition">市场手账 · 抓重点，也看分歧</span></div>
<div class="kicker">事实分歧</div>
<h1><span>事实、观点与情绪分开看</span></h1>
<div class="sub">先看已确认事实，再看研究判断和市场情绪是否一致。</div>
<div class="notes"><section class="note"><b>1</b><p>消费者价格指数(CPI)发布：2026-09-11发布，页面仅列标题与日期，无具体数值</p></section><section class="note"><b>2</b><p>研究早观点</p></section><section class="note"><b>3</b><p>继续观察公开信息变化，避免仅凭单一信号下结论。</p></section></div>
<div class="margin"><span class="sketch"></span><span>基于公开信息整理 · 保持独立判断，关注事实变化</span></div>
<footer><span>仅供信息参考，不构成投资建议</span><span>2026-09-15 · 早刊</span></footer>
</main></body></html>
