name: Normalize Fongap Studio metadata

on:
  push:
    paths:
      - ".github/workflows/normalize-fongap-studio.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Normalize AgentDock source copyright
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("projects/AgentDock/source/AgentDock.c")
          text = path.read_text(encoding="utf-8")
          old = " * Copyright (c) 2026 Fongap\n"
          new = " * Copyright (c) 2026 Fongap Studio\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one legacy copyright line, found {count}")
          with path.open("w", encoding="utf-8", newline="") as handle:
              handle.write(text.replace(old, new, 1))
          PY
          git rm .github/workflows/normalize-fongap-studio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/AgentDock/source/AgentDock.c
          git commit -m "chore: unify AgentDock copyright holder"
          git push
